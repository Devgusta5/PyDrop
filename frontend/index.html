<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the app can paint into the safe areas on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F12" />
    <meta name="color-scheme" content="dark" />

    <title>PyDrop — Direct file transfer</title>
    <meta
      name="description"
      content="Transfer files directly between your devices. No account, no permanent storage — the file goes straight from one device to the other."
    />

    <link rel="icon" type="image/png" sizes="64x64" href="/pydrop-favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pydrop-icon-192.png" />
    <link rel="apple-touch-icon" href="/pydrop-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PyDrop" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="PyDrop — Direct file transfer" />
    <meta
      property="og:description"
      content="Transfer files directly between your devices. No account, no permanent storage."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pydrop-icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
